<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">Acoustic sound localization project overview</title>
  <desc id="desc">Three microphone audio capture feeds a Python localization and serial control script, which sends a command to an Arduino servo. An ESP32-CAM provides a separate video stream.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101b35"/><stop offset="1" stop-color="#192e4d"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#77d6c2"/></marker>
    <style>
      .title{font:700 27px Arial,sans-serif;fill:#f5f8ff}.sub{font:15px Arial,sans-serif;fill:#b8c7dc}
      .head{font:700 17px Arial,sans-serif;fill:#f5f8ff}.body{font:14px Arial,sans-serif;fill:#d4deec}
      .box{fill:#223b5c;stroke:#5588a8;stroke-width:2}.aux{fill:#263653;stroke:#7788a2;stroke-width:2}
      .line{stroke:#77d6c2;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect width="1120" height="440" rx="24" fill="url(#bg)"/>
  <text x="48" y="58" class="title">Acoustic sound localization &amp; camera tracking</text>
  <text x="48" y="87" class="sub">Implementation overview based on the source files in this repository</text>
  <rect x="52" y="151" width="245" height="170" rx="16" class="box"/>
  <text x="76" y="184" class="head">ESP32 audio capture</text>
  <text x="76" y="216" class="body">Microphone array</text><text x="76" y="240" class="body">I2S audio samples</text>
  <text x="76" y="281" class="sub">firmware/esp32-audio</text>
  <rect x="400" y="151" width="290" height="170" rx="16" class="box"/>
  <text x="424" y="184" class="head">Python host script</text>
  <text x="424" y="216" class="body">Audio processing / direction estimate</text><text x="424" y="240" class="body">Serial command to servo controller</text>
  <text x="424" y="281" class="sub">src/python (partial snapshot)</text>
  <rect x="795" y="151" width="270" height="170" rx="16" class="box"/>
  <text x="819" y="184" class="head">Arduino + servo</text>
  <text x="819" y="216" class="body">Receives serial command</text><text x="819" y="240" class="body">Turns the servo mechanism</text>
  <text x="819" y="281" class="sub">firmware/arduino-servo</text>
  <path d="M297 235H390" class="line"/><path d="M690 235H785" class="line"/>
  <rect x="400" y="354" width="290" height="58" rx="13" class="aux"/>
  <text x="425" y="379" class="head">ESP32-CAM video server</text><text x="425" y="400" class="sub">Separate video stream · firmware/esp32-camera</text>
  <path d="M545 321V345" class="dash"/>
</svg>
